<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening MarineTraffic</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #0f172a;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <p>Opening MarineTraffic in this browser window…</p>
    <script>
      (function () {
        var allowed = 'https://www.marinetraffic.com/';
        var url = new URLSearchParams(window.location.search).get('url') || '';
        if (url.indexOf(allowed) !== 0) {
          document.body.textContent = 'Invalid ship link.';
          return;
        }
        // Delay past the original tap so iOS/Android do not steal this as an app link.
        window.setTimeout(function () {
          window.location.replace(url);
        }, 50);
      })();
    </script>
  </body>
</html>
